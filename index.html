<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0b0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Bunker Prompter</title>
<style>
:root{
  --bg:#0b0b0c;--fg:#f4f1ea;--acc:#ff6a1a;--mut:#8a867e;--card:#17171a;--line:#2a2a2e;
  --ease-out:cubic-bezier(.23,1,.32,1);
  --ease-drawer:cubic-bezier(.32,.72,0,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
textarea{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none;touch-action:manipulation}
.press{transition:transform 160ms var(--ease-out),background-color 160ms ease,opacity 200ms ease}
.press:active{transform:scale(.96)}
.hidden{display:none!important}

/* ===== Editor ===== */
#editor{position:fixed;inset:0;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 16px);gap:12px;overflow:auto}
#editor h1{margin:0 0 2px;font-size:21px;letter-spacing:-.01em;font-weight:750}
#editor h1 b{color:var(--acc)}
#script{flex:1;min-height:200px;width:100%;resize:none;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:16px;padding:16px;font-size:17px;line-height:1.55;outline:none;transition:border-color 160ms ease}
#script:focus{border-color:var(--acc)}
.meta{font-size:13px;color:var(--mut);line-height:1.45}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.seg{position:relative;display:flex;background:var(--card);border-radius:12px;padding:3px;border:1px solid var(--line)}
.seg button{position:relative;z-index:1;padding:9px 12px;border-radius:9px;font-size:14px;color:var(--mut);transition:color 160ms ease}
.seg button.on{color:var(--fg)}
.seg .pill{position:absolute;top:3px;bottom:3px;left:0;border-radius:9px;background:#2c2c31;transition:transform 220ms var(--ease-out),width 220ms var(--ease-out)}
.go{width:100%;padding:17px;border-radius:16px;background:var(--acc);color:#111;font-weight:750;font-size:17px}

/* ===== Studio ===== */
#studio{position:fixed;inset:0;background:#000;overflow:hidden}
#stage{position:absolute;overflow:hidden;background:#000;touch-action:none}
#cam{width:100%;height:100%;object-fit:cover;display:block}
#cam.mirror{transform:scaleX(-1)}
#stage::after{content:"";position:absolute;inset:0;border:1px solid rgba(255,255,255,.12);pointer-events:none}

#prompt{position:absolute;left:0;right:0;top:0;overflow:hidden;touch-action:none;
  -webkit-mask-image:linear-gradient(#0000,#000 12%,#000 88%,#0000);mask-image:linear-gradient(#0000,#000 12%,#000 88%,#0000);
  transition:background-color 200ms ease}
#prompt.bg{background:rgba(0,0,0,.5)}
#text{position:absolute;left:0;right:0;margin:0 auto;padding:0 6%;font-weight:700;line-height:1.38;letter-spacing:-.005em;text-shadow:0 2px 8px rgba(0,0,0,.9),0 0 2px #000;white-space:pre-wrap;will-change:transform}
#guide{position:absolute;left:0;right:0;height:0;border-top:2px solid rgba(255,106,26,.7);pointer-events:none}
#guide::before{content:"";position:absolute;left:4px;top:-8px;border:7px solid transparent;border-left:10px solid var(--acc)}
#pauseHint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.95);opacity:0;background:rgba(0,0,0,.6);padding:8px 14px;border-radius:999px;font-size:14px;pointer-events:none;transition:opacity 160ms ease,transform 200ms var(--ease-out)}
#pauseHint.show{opacity:1;transform:translate(-50%,-50%) scale(1)}

#count{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:32vmin;font-weight:800;color:#fff;text-shadow:0 4px 40px rgba(0,0,0,.8);pointer-events:none;font-variant-numeric:tabular-nums}
#rec{position:absolute;top:calc(env(safe-area-inset-top) + 10px);right:12px;display:flex;align-items:center;gap:7px;background:rgba(0,0,0,.6);padding:6px 11px;border-radius:999px;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;z-index:5;opacity:0;transform:translateY(-6px);transition:opacity 200ms ease,transform 200ms var(--ease-out);pointer-events:none}
#rec.show{opacity:1;transform:none}
#rec i{width:9px;height:9px;border-radius:50%;background:#ff3b30;animation:bl 1.2s ease-in-out infinite}
@keyframes bl{50%{opacity:.25}}

#bar{position:absolute;left:0;right:0;bottom:0;padding:28px 14px calc(env(safe-area-inset-bottom) + 14px);background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.8) 45%);display:flex;flex-direction:column;gap:12px;z-index:6}
.ctrl{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ic{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;font-size:19px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.ic.on{background:var(--acc);color:#111}
.ic:disabled{opacity:0;pointer-events:none}
#recBtn{width:76px;height:76px;border-radius:50%;border:4px solid #fff;display:flex;align-items:center;justify-content:center}
#recBtn span{width:58px;height:58px;border-radius:29px;background:#ff3b30;transition:transform 220ms var(--ease-out),border-radius 220ms var(--ease-out)}
#recBtn.on span{transform:scale(.5);border-radius:12px}

/* lentes / zoom */
#lens{display:flex;justify-content:center;gap:6px;min-height:34px;transition:opacity 200ms ease}
#lens button{min-width:42px;height:34px;padding:0 10px;border-radius:999px;background:rgba(0,0,0,.5);font-size:13px;font-weight:650;color:#ddd;font-variant-numeric:tabular-nums}
#lens button.on{background:rgba(255,255,255,.92);color:#111}
#zoomRow{display:flex;align-items:center;gap:10px;font-size:13px;color:#ddd;padding:0 6px;transition:opacity 200ms ease}
#zoomRow input{flex:1;accent-color:#fff}
#zoomO{width:36px;text-align:right;font-variant-numeric:tabular-nums}

/* hoja de ajustes */
#sheet{position:absolute;left:0;right:0;bottom:0;z-index:10;background:rgba(22,22,25,.94);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-radius:20px 20px 0 0;padding:10px 16px calc(env(safe-area-inset-bottom) + 16px);display:flex;flex-direction:column;gap:12px;
  transform:translateY(100%);transition:transform 260ms var(--ease-drawer);touch-action:none}
#sheet.open{transform:none}
#sheet .grab{width:38px;height:5px;border-radius:3px;background:#555;margin:0 auto 4px}
#scrim{position:absolute;inset:0;z-index:9;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity 200ms ease}
#scrim.show{opacity:1;pointer-events:auto}
.sl{display:flex;align-items:center;gap:12px;font-size:14px;color:#ddd}
.sl label{width:78px}
.sl input{flex:1;accent-color:var(--acc)}
.sl output{width:34px;text-align:right;font-variant-numeric:tabular-nums;color:var(--mut)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:9px 12px;border-radius:12px;background:#2a2a2e;font-size:14px;color:#ccc}
.chip.on{background:var(--acc);color:#111}

/* ===== Revisión ===== */
#review{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;z-index:20}
#review video{flex:1;width:100%;min-height:0;background:#000}
#review .acts{display:flex;gap:10px;padding:12px 12px calc(env(safe-area-inset-bottom) + 12px)}
#review .acts>*{flex:1;padding:15px;border-radius:14px;background:#222;text-align:center;font-weight:650;text-decoration:none;color:#fff}
#review .acts .pri{background:var(--acc);color:#111}

#toast{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 110px);background:#2b1515;border:1px solid #5a2323;color:#fff;padding:12px 14px;border-radius:14px;font-size:14px;z-index:50;
  opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity 200ms ease,transform 200ms var(--ease-out)}
#toast.show{opacity:1;transform:none}

@media (hover:hover) and (pointer:fine){
  .ic:hover{background:rgba(255,255,255,.22)} .ic.on:hover{background:var(--acc)}
  .go:hover{filter:brightness(1.05)}
}
@media (prefers-reduced-motion:reduce){
  #rec,#toast,#pauseHint{transition-property:opacity}
  #sheet{transform:none;opacity:0;pointer-events:none;transition:opacity 200ms ease} #sheet.open{opacity:1;pointer-events:auto}
}
</style>
</head>
<body>

<!-- EDITOR -->
<section id="editor">
  <h1>Bunker <b>Prompter</b></h1>
  <textarea id="script" placeholder="Pega o escribe tu guion aquí…"></textarea>
  <div class="meta" id="stats">0 palabras</div>
  <div class="row">
    <div class="seg" id="fmt">
      <button data-v="9:16">9:16</button>
      <button data-v="16:9">16:9</button>
      <button data-v="1:1">1:1</button>
      <button data-v="full">Completo</button>
    </div>
    <div class="seg" id="facing">
      <button data-v="user">Frontal</button>
      <button data-v="environment">Trasera</button>
    </div>
  </div>
  <button class="go press" id="start">🎬 Abrir cámara</button>
  <div class="meta">Lo que ves en el recuadro es exactamente lo que se graba. “Completo” usa todo el sensor (el menor zoom posible). El texto <b>no</b> sale en el video.</div>
</section>

<!-- STUDIO -->
<section id="studio" class="hidden">
  <div id="stage"><video id="cam" playsinline autoplay muted></video></div>
  <div id="prompt" class="bg"><div id="text"></div><div id="guide"></div><div id="pauseHint">Pausa</div></div>
  <div id="count" class="hidden"></div>
  <div id="rec"><i></i><span id="clock">0:00</span></div>

  <div id="bar">
    <div id="lens"></div>
    <div id="zoomRow" class="hidden"><span>🔍</span><input id="zoom" type="range" step="0.1"><span id="zoomO">1×</span></div>
    <div class="ctrl">
      <button class="ic press" id="back" title="Editar guion">✎</button>
      <button class="ic press" id="settings" title="Ajustes">⚙︎</button>
      <button id="recBtn" class="press" title="Grabar (R)"><span></span></button>
      <button class="ic press" id="playBtn" title="Pausa/Play texto (espacio)">▶</button>
      <button class="ic press" id="flip" title="Cambiar cámara">⟲</button>
    </div>
  </div>

  <div id="scrim"></div>
  <div id="sheet">
    <div class="grab"></div>
    <div class="sl"><label>Velocidad</label><input id="speed" type="range" min="1" max="20"><output id="speedO"></output></div>
    <div class="sl"><label>Letra</label><input id="size" type="range" min="18" max="90"><output id="sizeO"></output></div>
    <div class="sl"><label>Alto texto</label><input id="height" type="range" min="20" max="80"><output id="heightO"></output></div>
    <div class="sl"><label>Ancho</label><input id="width" type="range" min="40" max="100"><output id="widthO"></output></div>
    <div class="chips">
      <button class="chip press" id="bgBtn">Fondo oscuro</button>
      <button class="chip press" id="mirrorCam">Espejo cámara</button>
      <button class="chip press" id="mirrorText">Texto invertido</button>
      <button class="chip press" id="restartBtn">⏮ Al inicio</button>
    </div>
  </div>
</section>

<!-- REVISIÓN -->
<section id="review" class="hidden">
  <video id="out" playsinline controls></video>
  <div class="acts">
    <button id="again" class="press">↺ Repetir</button>
    <button id="share" class="press">Compartir</button>
    <a id="dl" class="pri press" download>⬇ Descargar</a>
  </div>
</section>

<div id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const LS='bprompter:';
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const cfg=Object.assign({fmt:'9:16',facing:'user',speed:6,size:40,height:40,width:100,mirrorText:false,bg:true,mirrorCam:true,dev:{},zoom:{}},
  JSON.parse(localStorage.getItem(LS+'cfg')||'{}'));
cfg.dev=cfg.dev||{};cfg.zoom=cfg.zoom||{};
const save=()=>localStorage.setItem(LS+'cfg',JSON.stringify(cfg));

/* ---------- editor ---------- */
const script=$('#script');
script.value=localStorage.getItem(LS+'script')||'';
const stats=()=>{const w=(script.value.trim().match(/\S+/g)||[]).length,s=Math.round(w/150*60);
  $('#stats').textContent=`${w} palabras · ~${Math.floor(s/60)}:${String(s%60).padStart(2,'0')} leyendo a ritmo normal`};
script.oninput=()=>{localStorage.setItem(LS+'script',script.value);stats()};stats();

function seg(id,key){
  const el=$(id);const pill=document.createElement('span');pill.className='pill';el.prepend(pill);
  const btns=[...el.querySelectorAll('button')];
  const sync=instant=>{
    btns.forEach(b=>b.classList.toggle('on',b.dataset.v===cfg[key]));
    const on=btns.find(b=>b.dataset.v===cfg[key])||btns[0];
    if(instant)pill.style.transition='none';
    pill.style.width=on.offsetWidth+'px';pill.style.transform=`translateX(${on.offsetLeft}px)`;
    if(instant){pill.offsetWidth;pill.style.transition=''}
  };
  btns.forEach(b=>b.onclick=()=>{cfg[key]=b.dataset.v;save();sync()});
  sync(true);return sync;
}
const syncFmt=seg('#fmt','fmt'),syncFacing=seg('#facing','facing');

function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),4500)}

/* ---------- cámara ---------- */
let stream=null,track=null;
const cam=$('#cam');
function ratio(){ if(cfg.fmt==='full')return cam.videoWidth?cam.videoWidth/cam.videoHeight:3/4; const [a,b]=cfg.fmt.split(':').map(Number);return a/b }

async function openCam(){
  if(stream)stream.getTracks().forEach(t=>t.stop());
  // Se pide el formato NATIVO del sensor (4:3) para que el navegador no recorte = menos zoom.
  const wide=cfg.fmt==='16:9';
  const v={width:{ideal:1920},height:{ideal:wide?1080:1440},aspectRatio:{ideal:wide?16/9:4/3},frameRate:{ideal:30}};
  const id=cfg.dev[cfg.facing];
  if(id)v.deviceId={exact:id};else v.facingMode={ideal:cfg.facing};
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:v,audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
  }catch(e){
    if(id){delete cfg.dev[cfg.facing];save();return openCam()}
    toast('No pude abrir cámara/micrófono: '+e.message+'. Revisa los permisos del navegador.');throw e}
  track=stream.getVideoTracks()[0];
  cam.srcObject=stream;
  await new Promise(r=>{if(cam.readyState>=1)r();else cam.onloadedmetadata=r});
  await cam.play().catch(()=>{});
  cam.classList.toggle('mirror',cfg.mirrorCam&&cfg.facing==='user');
  layout();await setupLens();
}

/* El recuadro tiene el aspecto del formato: lo que ves = lo que se graba (sin zoom extra por el tamaño de pantalla). */
function layout(){
  const W=innerWidth,H=innerHeight,r=ratio();
  let w=W,h=W/r;if(h>H){h=H;w=H*r}
  Object.assign($('#stage').style,{width:w+'px',height:h+'px',left:(W-w)/2+'px',top:(H-h)/2+'px'});
  applyText();
}
addEventListener('resize',()=>{if(!$('#studio').classList.contains('hidden'))layout()});
cam.addEventListener('resize',()=>{if(stream)layout()});

/* Lentes y zoom: 0.5× gran angular en iPhone, zoom por hardware en Android. */
async function setupLens(){
  const L=$('#lens');L.innerHTML='';$('#zoomRow').classList.add('hidden');
  const caps=track.getCapabilities?track.getCapabilities():{};
  if(caps.zoom&&caps.zoom.max>caps.zoom.min){
    const z=$('#zoom'),zmin=caps.zoom.min,zmax=Math.min(caps.zoom.max,5);
    z.min=zmin;z.max=zmax;z.step=caps.zoom.step||.1;
    const mark=()=>[...L.children].forEach(b=>b.classList.toggle('on',Math.abs(+b.dataset.z-z.value)<.05));
    const set=async val=>{val=+val;try{await track.applyConstraints({advanced:[{zoom:val}]})}catch(e){}
      $('#zoomO').textContent=(+val.toFixed(1))+'×';cfg.zoom[cfg.facing]=val;save();mark()};
    [...new Set([zmin,1,2])].filter(x=>x>=zmin&&x<=zmax).forEach(val=>{
      const b=document.createElement('button');b.className='press';b.dataset.z=val;b.textContent=(+val.toFixed(1))+'×';
      b.onclick=()=>{z.value=val;set(val)};L.appendChild(b)});
    const want=cfg.zoom[cfg.facing]??zmin; // por defecto el MÍNIMO zoom
    z.value=want;set(want);z.oninput=()=>set(z.value);
    $('#zoomRow').classList.remove('hidden');
    return;
  }
  if(cfg.facing!=='environment')return;
  const devs=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='videoinput'&&d.label);
  const pick=[
    ['0.5×',d=>/ultra ?wide|ultra ?gran angular/i.test(d.label)],
    ['1×',d=>/^(back camera|c[aá]mara (trasera|posterior))$/i.test(d.label.trim())],
    ['2×',d=>/telephoto|teleobjetivo/i.test(d.label)]
  ];
  const cur=track.getSettings().deviceId;
  const opts=pick.map(([n,f])=>[n,devs.find(f)]).filter(x=>x[1]);
  if(opts.length<2)return;
  opts.forEach(([n,d])=>{const b=document.createElement('button');b.className='press'+(d.deviceId===cur?' on':'');b.textContent=n;
    b.onclick=async()=>{if(isRec())return;cfg.dev[cfg.facing]=d.deviceId;save();await openCam()};L.appendChild(b)});
}

/* ---------- prompter ---------- */
const text=$('#text'),prompt=$('#prompt');
let pos=0,playing=false,vel=0,last=0;
const anchor=()=>prompt.clientHeight*.3;
function applyText(){
  text.textContent=script.value.trim()||'Escribe tu guion primero ✎';
  text.style.fontSize=cfg.size+'px';text.style.width=cfg.width+'%';
  prompt.style.height=cfg.height+'%';prompt.classList.toggle('bg',cfg.bg);
  $('#guide').style.top=anchor()+'px';render();
}
function render(){
  const max=text.scrollHeight-anchor()*.3;
  if(pos>max){pos=max;if(playing)setPlay(false)}
  if(pos<0)pos=0;
  text.style.transform=`translateY(${anchor()-pos}px)`+(cfg.mirrorText?' scaleX(-1)':'');
}
// arranque/frenado suave (~150ms) para que el texto no brinque al pausar
function tick(t){
  const dt=Math.min(.05,(t-last)/1000||0);last=t;
  const target=playing?cfg.speed*cfg.size*.1:0;
  vel+=(target-vel)*Math.min(1,dt*(reduce?60:7));
  if(Math.abs(vel)>.05){pos+=vel*dt;render()}
  requestAnimationFrame(tick)}
requestAnimationFrame(tick);
function setPlay(p){playing=p;const b=$('#playBtn');b.textContent=p?'❚❚':'▶';b.classList.toggle('on',p)}
function hint(s){const h=$('#pauseHint');h.textContent=s;h.classList.add('show');clearTimeout(hint.t);hint.t=setTimeout(()=>h.classList.remove('show'),650)}

/* tocar = pausa/sigue; arrastrar = mover el texto a mano */
let drag=null;
function bindDrag(el){
  el.addEventListener('pointerdown',e=>{if(drag)return;drag={id:e.pointerId,y:e.clientY,moved:false};el.setPointerCapture(e.pointerId)});
  el.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;const d=e.clientY-drag.y;
    if(!drag.moved&&Math.abs(d)>6){drag.moved=true;drag.was=playing;playing=false;vel=0}
    if(drag.moved){pos-=d;drag.y=e.clientY;render()}});
  const end=e=>{if(!drag||e.pointerId!==drag.id)return;
    if(!drag.moved){setPlay(!playing);hint(playing?'Sigue':'Pausa')}else if(drag.was)setPlay(true);
    drag=null};
  el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
}
bindDrag(prompt);bindDrag($('#stage'));
addEventListener('wheel',e=>{if($('#studio').classList.contains('hidden'))return;pos+=e.deltaY*.5;render()},{passive:true});
addEventListener('keydown',e=>{if($('#studio').classList.contains('hidden'))return;
  if(e.code==='Space'){e.preventDefault();setPlay(!playing)}
  else if(e.code==='ArrowUp'){cfg.speed=Math.min(20,cfg.speed+1);syncSl()}
  else if(e.code==='ArrowDown'){cfg.speed=Math.max(1,cfg.speed-1);syncSl()}
  else if(e.code==='KeyR')toggleRec();
});

/* ajustes */
const SL=['speed','size','height','width'];
function syncSl(){SL.forEach(k=>{$('#'+k).value=cfg[k];$('#'+k+'O').textContent=cfg[k]});save()}
SL.forEach(k=>$('#'+k).oninput=()=>{cfg[k]=+$('#'+k).value;$('#'+k+'O').textContent=cfg[k];save();applyText()});syncSl();
function tog(id,k,fn){const b=$(id);b.classList.toggle('on',!!cfg[k]);b.onclick=()=>{cfg[k]=!cfg[k];b.classList.toggle('on',cfg[k]);save();fn&&fn()}}
tog('#mirrorText','mirrorText',applyText);tog('#bgBtn','bg',applyText);
tog('#mirrorCam','mirrorCam',()=>cam.classList.toggle('mirror',cfg.mirrorCam&&cfg.facing==='user'));
$('#restartBtn').onclick=()=>{pos=0;vel=0;render()};
const sheet=$('#sheet'),scrim=$('#scrim');
function openSheet(o){sheet.classList.toggle('open',o);scrim.classList.toggle('show',o);$('#settings').classList.toggle('on',o)}
$('#settings').onclick=()=>openSheet(!sheet.classList.contains('open'));
scrim.onclick=()=>openSheet(false);
// arrastrar la hoja hacia abajo para cerrar (por distancia o por velocidad)
(()=>{let s=null;
  sheet.addEventListener('pointerdown',e=>{if(e.target.closest('input,button'))return;s={y:e.clientY,t:Date.now()};sheet.setPointerCapture(e.pointerId);sheet.style.transition='none'});
  sheet.addEventListener('pointermove',e=>{if(!s)return;const d=e.clientY-s.y;sheet.style.transform=`translateY(${d>0?d:d*.2}px)`});
  const up=e=>{if(!s)return;const d=e.clientY-s.y,v=d/Math.max(1,Date.now()-s.t);sheet.style.transition='';sheet.style.transform='';
    if(d>80||v>.11)openSheet(false);s=null};
  sheet.addEventListener('pointerup',up);sheet.addEventListener('pointercancel',up);
})();
$('#playBtn').onclick=()=>setPlay(!playing);

/* ---------- grabación ---------- */
let rec=null,chunks=[],t0=0,clockI=null,blobUrl=null,lastBlob=null,mime='',drawing=false,busy=false;
const isRec=()=>rec&&rec.state==='recording';
function pickMime(){
  const c=['video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];
  return c.find(m=>window.MediaRecorder&&MediaRecorder.isTypeSupported(m))||'';
}
/* Si el formato no coincide con la cámara, recorta en canvas al mismo encuadre que ves. */
function recStream(){
  const vw=cam.videoWidth,vh=cam.videoHeight,r=ratio();
  if(!vw||Math.abs(vw/vh-r)<.02)return stream;
  let cw,ch;if(vw/vh>r){ch=vh;cw=Math.round(vh*r)}else{cw=vw;ch=Math.round(vw/r)}
  cw-=cw%2;ch-=ch%2;
  const c=document.createElement('canvas');c.width=cw;c.height=ch;const x=c.getContext('2d');
  const sx=(vw-cw)/2,sy=(vh-ch)/2;
  drawing=true;(function d(){if(!drawing)return;x.drawImage(cam,sx,sy,cw,ch,0,0,cw,ch);requestAnimationFrame(d)})();
  const out=c.captureStream(30);stream.getAudioTracks().forEach(t=>out.addTrack(t));return out;
}
async function countdown(){
  const c=$('#count');c.classList.remove('hidden');
  for(const n of [3,2,1]){
    c.textContent=n;
    c.animate(reduce?[{opacity:0},{opacity:1}]:[{opacity:0,transform:'scale(1.15)'},{opacity:1,transform:'scale(1)'}],{duration:220,easing:'cubic-bezier(.23,1,.32,1)',fill:'forwards'});
    await new Promise(r=>setTimeout(r,800));
  }
  c.classList.add('hidden');
}
function setRecUI(on){
  $('#recBtn').classList.toggle('on',on);$('#rec').classList.toggle('show',on);
  ['#back','#flip','#settings'].forEach(s=>$(s).disabled=on); // sin toques accidentales mientras grabas
  ['#lens','#zoomRow'].forEach(s=>{$(s).style.opacity=on?0:1;$(s).style.pointerEvents=on?'none':''});
  if(on)openSheet(false);
}
async function toggleRec(){
  if(isRec()){rec.stop();return}
  if(busy)return;
  if(!window.MediaRecorder){toast('Este navegador no puede grabar. Usa Chrome o Safari actualizado.');return}
  busy=true;mime=pickMime();openSheet(false);
  await countdown();
  chunks=[];const s=recStream();
  try{rec=new MediaRecorder(s,mime?{mimeType:mime,videoBitsPerSecond:8e6}:{})}catch(e){rec=new MediaRecorder(s)}
  rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);
  rec.onstop=finish;rec.start(1000);busy=false;
  navigator.vibrate?.(12);
  setRecUI(true);
  t0=Date.now();clockI=setInterval(()=>{const s=Math.floor((Date.now()-t0)/1000);$('#clock').textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`},250);
  setPlay(true);
}
$('#recBtn').onclick=toggleRec;
function finish(){
  drawing=false;clearInterval(clockI);setPlay(false);setRecUI(false);$('#clock').textContent='0:00';
  const type=(rec.mimeType||mime||'video/webm').split(';')[0];
  lastBlob=new Blob(chunks,{type});if(blobUrl)URL.revokeObjectURL(blobUrl);blobUrl=URL.createObjectURL(lastBlob);
  const ext=type.includes('mp4')?'mp4':'webm';
  lastBlob.fname=`prompter-${new Date().toISOString().slice(0,16).replace(/[:T]/g,'-')}.${ext}`;
  $('#out').src=blobUrl;$('#dl').href=blobUrl;$('#dl').download=lastBlob.fname;
  const R=$('#review');R.classList.remove('hidden');
  R.animate([{opacity:0,transform:'translateY(12px)'},{opacity:1,transform:'none'}],{duration:240,easing:'cubic-bezier(.23,1,.32,1)'});
}
$('#again').onclick=()=>{$('#out').pause();$('#review').classList.add('hidden');pos=0;vel=0;render()};
$('#share').onclick=async()=>{
  try{const f=new File([lastBlob],lastBlob.fname,{type:lastBlob.type});
    if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f]});
    else toast('Compartir no está disponible aquí: usa Descargar.')}catch(e){}
};

/* ---------- navegación ---------- */
let wake=null;
async function lockScreen(){try{wake=await navigator.wakeLock?.request('screen')}catch(e){}}
$('#start').onclick=async()=>{
  $('#editor').classList.add('hidden');$('#studio').classList.remove('hidden');
  try{await openCam()}catch(e){$('#studio').classList.add('hidden');$('#editor').classList.remove('hidden');return}
  pos=0;vel=0;setPlay(false);applyText();lockScreen();
};
$('#back').onclick=()=>{
  if(isRec())return;
  setPlay(false);openSheet(false);stream&&stream.getTracks().forEach(t=>t.stop());stream=null;wake?.release?.();
  $('#studio').classList.add('hidden');$('#editor').classList.remove('hidden');syncFmt(true);syncFacing(true);
};
$('#flip').onclick=async()=>{
  if(isRec())return;
  cfg.facing=cfg.facing==='user'?'environment':'user';save();syncFacing(true);await openCam();
};
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&stream)lockScreen()});
</script>
</body>
</html>
